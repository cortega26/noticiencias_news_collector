[app]
environment = "development"
debug = false
timezone = "UTC"

[paths]
data_dir = "/home/cortega26/noticiencias_news_collector/data"
logs_dir = "/home/cortega26/noticiencias_news_collector/data/logs"
dlq_dir = "/home/cortega26/noticiencias_news_collector/data/dlq"

[database]
driver = "sqlite"
path = "data/news_v3.db"
host = ""
port = ""
name = "noticiencias"
user = ""
sslmode = ""
connect_timeout = 10
statement_timeout = 30000
pool_size = 10
max_overflow = 5
pool_timeout = 30
pool_recycle = 1800

[collection]
collection_interval_hours = 6
request_timeout_seconds = 30
async_enabled = false

max_concurrent_requests = 1
max_articles_per_source = 5
recent_days_threshold = 365
user_agent = "NoticienciasBot/1.0 (+https://noticiencias.com)"
canonicalization_cache_size = 2048

[rate_limiting]
delay_between_requests_seconds = 1.0
domain_default_delay_seconds = 1.0
max_retries = 3
retry_delay_seconds = 1.0
backoff_base = 0.5
backoff_max = 10.0
jitter_max = 0.3

[robots]
respect_robots = true
cache_ttl_seconds = 3600

[dedup]
simhash_threshold = 10
simhash_candidate_window = 500

[scoring]
daily_top_count = 10
minimum_score = 0.3
mode = "cognitive"

workers = 1
reranker_seed = 1337
source_cap_percentage = 0.5
topic_cap_percentage = 0.6

[text_processing]
supported_languages = [ "en", "es", "pt", "fr",]
min_content_length = 100
boost_keywords = [ "breakthrough", "discovery", "research", "study", "clinical trial", "peer-reviewed", "published", "journal", "university", "scientists", "artificial intelligence", "machine learning", "climate change", "medical", "technology", "innovation", "Nobel", "FDA approved",]
penalty_keywords = [ "shocking", "you won't believe", "doctors hate", "miracle cure", "secret", "conspiracy", "hoax", "fake news",]

[enrichment]
default_model = "pattern_v1"
analysis_cache_size = 512
result_cache_size = 256

[news]
max_items = 50
default_language = "es"

[logging]
level = "INFO"
file_path = "/home/cortega26/noticiencias_news_collector/data/logs/collector.log"
max_file_size_mb = 10
retention_days = 30
format = "{time:YYYY-MM-DD HH:mm:ss} | {level:<8} | {name}:{line} | {message}"

[rate_limiting.domain_overrides]
"export.arxiv.org" = 20.0
"arxiv.org" = 20.0
"www.reddit.com" = 30.0
"reddit.com" = 30.0

[scoring.weights]
source_credibility = 0.1
recency = 0.1
content_quality = 0.1
engagement_potential = 0.7

[scoring.feature_weights]
source_credibility = 0.3
freshness = 0.25
content_quality = 0.25
engagement = 0.2

[scoring.freshness]
half_life_hours = 18.0
max_decay_hours = 168.0

[scoring.diversity_penalty]
weight = 0.15
max_penalty = 0.3

[scoring.content_quality_heuristics]
title_length_divisor = 120.0
summary_length_divisor = 400.0
entity_target_count = 5.0

[scoring.engagement_heuristics]
fallback_sentiment = 0.5
word_count_divisor = 800.0
external_weight = 0.6
length_weight = 0.4

[scoring.content_quality_heuristics.weights]
title = 0.4
summary = 0.4
entity = 0.2

[scoring.engagement_heuristics.sentiment_scores]
positive = 0.7
negative = 0.6
neutral = 0.5

[enrichment.models.pattern_v1]
version = "2025.02-pattern-v1"
provider = "pattern"
languages = [ "en", "es", "pt", "fr",]
default_language = "en"
default_topic = "general"

[enrichment.models.pattern_v1.sentiment]
default = "neutral"
tie_breaker = "neutral"

[enrichment.models.pattern_v1.sentiment.lexicon]
shared_positive = [ "confirmed", "progress", "celebrated", "avance", "avances", "innovador", "innovadora", "soluciones", "parceria", "sucesso",]
shared_negative = [ "warned", "risk", "crisis", "preocupante", "urgente", "urgentes", "inflation", "recession", "recesión", "recessão",]

[enrichment.models.pattern_v1.entities.entries]
[[enrichment.models.pattern_v1.entities.entries.shared]]
label = "ORG"
pattern = "NASA"
case_sensitive = false

