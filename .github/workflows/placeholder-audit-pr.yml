name: Placeholder Audit (PR)

on:
  pull_request:
    branches:
      - "*"


permissions:
  contents: read
  pull-requests: write
  security-events: write
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run placeholder audit
        id: audit
        continue-on-error: true
        run: |
          python -m tools.placeholder_audit --pr-diff-only --base origin/main --halo 10 --sarif audit.sarif --comment placeholder-report.md --format table
      - name: Upload SARIF
        continue-on-error: true
        if: always()
        uses: github/codeql-action/upload-sarif@1ad29ea4a422cce9a242a9fae469541dcd08addc # v4
        with:
          sarif_file: audit.sarif
      - name: Post placeholder summary
        if: always()
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: placeholder-report.md
      - name: Fail on audit findings
        if: steps.audit.outcome == 'failure'
        run: exit 1
