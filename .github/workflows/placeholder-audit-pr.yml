name: Placeholder Audit (PR)

on:
  pull_request:
    branches:
      - "*"


permissions:
  contents: read
  pull-requests: write
  security-events: write
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-env
        with:
          cache-key: ${{ hashFiles('requirements.lock', 'requirements-security.lock') }}
      - name: Run placeholder audit
        id: audit
        continue-on-error: true
        run: |
          .venv/bin/python -m tools.placeholder_audit --pr-diff-only --base origin/main --halo 10 --sarif audit.sarif --comment placeholder-report.md --format table
      - name: Upload SARIF
        continue-on-error: true
        if: always()
        uses: github/codeql-action/upload-sarif@e4c79b4e9ebfe577d446333c2e31ed81079e7b03 # v4
        with:
          sarif_file: audit.sarif
      - name: Post placeholder summary
        if: always()
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: placeholder-report.md
      - name: Fail on audit findings
        if: steps.audit.outcome == 'failure'
        run: exit 1
