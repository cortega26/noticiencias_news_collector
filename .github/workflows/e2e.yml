name: E2E Contract Test

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  contract-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          python -m textblob.download_corpora

      - name: Generate Content Export (Dry Run)
        run: |
          # Run collector in dry-run mode and export the JSON to output.json
          python main.py --dry-run --sources "MIT News" --export-json output.json

      - name: Run Validation (Schema Contract)
        run: |
          python scripts/validate_export.py output.json
