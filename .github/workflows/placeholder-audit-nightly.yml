name: Placeholder Audit (Nightly)

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}


jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-env
        with:
          cache-key: ${{ hashFiles('requirements.lock', 'requirements-security.lock', 'Makefile', '.pre-commit-config.yaml') }}
      - name: Run full placeholder audit
        id: audit
        run: |
          .venv/bin/python -m tools.placeholder_audit --halo 10 --sarif audit.sarif --comment placeholder-report.md --format table
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@e4c79b4e9ebfe577d446333c2e31ed81079e7b03 # v4
        with:
          sarif_file: audit.sarif
      - name: Upload audit report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: placeholder-audit-report
          path: placeholder-report.md
      - name: Publish summary
        run: |
          echo "### Placeholder Audit Summary" >> "$GITHUB_STEP_SUMMARY"
          cat placeholder-report.md >> "$GITHUB_STEP_SUMMARY"
