name: Placeholder Audit (Nightly)

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}


jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run full placeholder audit
        id: audit
        run: |
          python -m tools.placeholder_audit --halo 10 --sarif audit.sarif --comment placeholder-report.md --format table
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@1ad29ea4a422cce9a242a9fae469541dcd08addc # v4
        with:
          sarif_file: audit.sarif
      - name: Upload audit report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: placeholder-audit-report
          path: placeholder-report.md
      - name: Publish summary
        run: |
          echo "### Placeholder Audit Summary" >> "$GITHUB_STEP_SUMMARY"
          cat placeholder-report.md >> "$GITHUB_STEP_SUMMARY"
