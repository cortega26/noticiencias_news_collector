name: Mutation Testing

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"


jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-env
        with:
          cache-key: ${{ hashFiles('requirements.lock', 'requirements-security.lock') }}

      - name: Install mutation tooling
        run: .venv/bin/pip install mutmut

      - name: Run mutation smoke tests
        run: .venv/bin/python -m pytest tests/mutation_smoke

      - name: Run MutMut
        run: |
          .venv/bin/mutmut run
          .venv/bin/mutmut results
