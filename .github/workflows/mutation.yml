name: Mutation Testing

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - news_collector/editorial/categories.py
      - news_collector/editorial/health_scope.py
      - news_collector/logic/workflows/publication_identity.py
      - news_collector/validation/rules.py


permissions:
  contents: read

jobs:
  mutmut:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-env
        with:
          cache-key: ${{ hashFiles('requirements.lock', 'requirements-security.lock', 'Makefile', '.pre-commit-config.yaml') }}

      - name: Install mutation tooling
        run: .venv/bin/pip install mutmut

      - name: Run mutation smoke tests
        run: .venv/bin/python -m pytest tests/mutation_smoke

      - name: Run MutMut
        run: .venv/bin/mutmut run --max-children 2

      - name: Mutation score per module (fails below the floors in pyproject.toml)
        shell: bash  # explicit shell adds -o pipefail: a failing check must fail the job, not tee
        run: .venv/bin/python scripts/mutation_score.py --check | tee "$GITHUB_STEP_SUMMARY"
