name: Daily News Collection

on:
  schedule:
    # Run at 06:00 UTC every day
    - cron: "0 6 * * *"
  workflow_dispatch:
    # Allow manual triggering from GitHub UI

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  collect-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore virtualenv cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.lock', 'requirements-security.lock') }}

      - name: Bootstrap (idempotent)
        run: make bootstrap

      - name: Run News Collector
        run: .venv/bin/python scripts/run_collector.py --export-json data/exports/latest_articles.json
        env:
          LOG_LEVEL: INFO

      - name: Commit and Push Data
        run: |
          git config --global user.name "Noticiencias Bot"
          git config --global user.email "bot@noticiencias.com"

          # Check for changes in data/ folder
          git add data/exports/latest_articles.json

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🤖 Data update: $(date -u +'%Y-%m-%d')"
            git push
          fi
      - name: Alert on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "🚨 Collector Failed: $(date -u +'%Y-%m-%d')" \
            --body "The daily news collector failed. Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --assignee ${{ github.actor }}
