name: Daily News Collection

on:
  schedule:
    # Runs Monday, Wednesday, Friday at 06:00 UTC.
    # Reduced from daily to 3×/week to conserve GitHub Actions minutes.
    - cron: "0 6 * * 1,3,5"
  workflow_dispatch:
    # Allow manual triggering from GitHub UI

concurrency:
  group: daily-collector-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  collect-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env
        with:
          cache-key: ${{ hashFiles('requirements.lock', 'requirements-security.lock') }}

      - name: Run News Collector
        run: .venv/bin/python scripts/run_collector.py --export-json data/exports/latest_articles.json
        env:
          LOG_LEVEL: INFO

      - name: Commit and Push Data
        run: |
          git config --global user.name "Noticiencias Bot"
          git config --global user.email "bot@noticiencias.com"

          # Check for changes in data/ folder
          git add data/exports/latest_articles.json

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🤖 Data update: $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Alert on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "🚨 Collector Failed: $(date -u +'%Y-%m-%d')" \
            --body "The daily news collector failed. Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --assignee ${{ github.actor }}
