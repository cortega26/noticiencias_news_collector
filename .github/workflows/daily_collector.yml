name: Daily News Collection

on:
  schedule:
    # Runs Monday, Wednesday, Friday at 06:00 UTC.
    # Reduced from daily to 3×/week to conserve GitHub Actions minutes.
    - cron: "0 6 * * 1,3,5"
  workflow_dispatch:
    # Allow manual triggering from GitHub UI

concurrency:
  group: daily-collector-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  collect-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env
        with:
          cache-key: ${{ hashFiles('requirements.lock', 'requirements-security.lock') }}

      - name: Run News Collector
        run: .venv/bin/python scripts/run_collector.py --export-json data/exports/latest_articles.json
        env:
          LOG_LEVEL: INFO

      # NOTE (plan 071/073): do NOT commit data/exports/latest_articles.json
      # from this job. It is built against an ephemeral CI database whose
      # autoincrement ids do not match production, and every downstream
      # consumer joins/filters by id — a committed CI export once caused a
      # wrong-article publish (run 18). The committed file is now curated
      # explicitly (production-DB regen); the refinery prefers the local
      # sibling export and the plan-071 identity guard rejects mismatches.
      - name: Verify export was produced (not committed)
        run: |
          test -f data/exports/latest_articles.json && echo "export OK (local only, not committed)."

      - name: Alert on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "🚨 Collector Failed: $(date -u +'%Y-%m-%d')" \
            --body "The daily news collector failed. Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --assignee ${{ github.actor }}
