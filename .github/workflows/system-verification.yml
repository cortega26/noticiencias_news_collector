name: System Verification (S1)

on:
  push:
    branches: ["main"]
    paths:
      - "news_collector/system/**"
      - "tests/unit/system/**"
      - "tools/ci/**"
  pull_request:
    branches: ["main"]
    paths:
      - "news_collector/system/**"
      - "tests/unit/system/**"
      - "tools/ci/**"
  workflow_dispatch:


jobs:
  system-contract-and-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ./.github/actions/setup-python-env
        with:
          cache-key: ${{ hashFiles('requirements.lock', 'requirements-security.lock') }}

      - name: Run S1 Verification
        run: |
          make test-system
