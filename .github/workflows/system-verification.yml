name: System Verification (S1)

on:
  push:
    branches: ["main"]
    paths:
      - "news_collector/system/**"
      - "tests/unit/system/**"
      - "tools/ci/**"
  pull_request:
    branches: ["main"]
    paths:
      - "news_collector/system/**"
      - "tests/unit/system/**"
      - "tools/ci/**"
  workflow_dispatch:


jobs:
  system-contract-and-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-env
        with:
          cache-key: ${{ hashFiles('requirements.lock', 'requirements-security.lock') }}

      - name: Run S1 Verification
        run: |
          make test-system
