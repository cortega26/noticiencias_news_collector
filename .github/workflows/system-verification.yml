name: System Verification (S1)

on:
  push:
    branches: ["main"]
    paths:
      - "news_collector/system/**"
      - "tests/unit/system/**"
      - "tools/ci/**"
  pull_request:
    branches: ["main"]
    paths:
      - "news_collector/system/**"
      - "tests/unit/system/**"
      - "tools/ci/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  system-contract-and-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pytest pytest-cov pytest-asyncio

      - name: Run S1 Verification
        run: |
          make test-system
