name: Source Reliability & Gate

on:
  push:
    branches: [main, develop]
    paths:
      - "news_collector/collectors/**"
      - "news_collector/config/sources.yaml"
      - "news_collector/contracts/**"
      - "tests/test_feed_reliability.py"
      - "tests/test_source_config.py"
      - "tests/test_llm_resilience.py"
      - ".github/workflows/source_reliability.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "news_collector/collectors/**"
      - "news_collector/config/sources.yaml"
      - "news_collector/contracts/**"
      - "tests/test_feed_reliability.py"
      - "tests/test_source_config.py"
      - "tests/test_llm_resilience.py"
      - ".github/workflows/source_reliability.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  gate_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore virtualenv cache
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.lock', 'requirements-security.lock') }}

      - name: Bootstrap (idempotent)
        run: make bootstrap

      - name: Run Source Config Validation
        run: .venv/bin/pytest tests/test_source_config.py -v

      - name: Run Feed Reliability Tests
        run: .venv/bin/pytest tests/test_feed_reliability.py -v

      - name: Run LLM Resilience Tests
        env:
          OLLAMA_API_URL: "http://localhost:59999"
        run: .venv/bin/pytest tests/test_llm_resilience.py -v
