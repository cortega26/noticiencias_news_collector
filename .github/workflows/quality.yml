name: Code Quality


on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  npm-audit:
    name: NPM dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Audit admin and editorial tool lockfiles (including development)
        run: |
          npm audit --prefix apps/admin --include=dev --audit-level=low
          npm audit --prefix tools/editorial_eval --include=dev --audit-level=low

  quality-gate:
    name: Code Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.lock
            requirements-security.lock
            requirements-semgrep.lock

      - name: Install dependencies
        run: |
          make bootstrap

      - name: Restore semgrep tool environment cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .venv-security
          # The tool env is defined solely by its own hash-pinned lock. A
          # restored stamp makes `make bootstrap-security` a no-op; a miss
          # rebuilds it from the lock.
          key: venv-security-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements-semgrep.lock') }}

      - name: Provision semgrep tool environment
        run: |
          make bootstrap-security

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          WORKDIR="$(mktemp -d)"
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$WORKDIR/$TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          curl -sSL -o "$WORKDIR/checksums.txt" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "$TARBALL" "$WORKDIR/checksums.txt" > "$WORKDIR/expected.sha256"
          (cd "$WORKDIR" && sha256sum -c expected.sha256)
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xz -C "$RUNNER_TEMP/bin" -f "$WORKDIR/$TARBALL" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run Quality Checks (CI Strict Mode)
        run: |
          make quality-ci
          make quality-gate

      - name: Audit Dev/Refinery Dependencies (security-dev)
        run: |
          # Same shared gate as every other pip-audit leg. The audited security
          # lock is semgrep-free; no allowlist entry remains (plan 156).
          make security-dev

      - name: Run Secret Scan (gitleaks)
        run: |
          mkdir -p reports/security
          # No --redact: baseline matching (gitleaks 8.18) is content-based, so
          # redacting the match would disable .gitleaks-baseline.json. The report
          # goes to a file and stdout only prints counts, not secrets.
          gitleaks detect --source . --config .gitleaks.toml --baseline-path .gitleaks-baseline.json \
            --report-format json --report-path reports/security/gitleaks.json \
            --no-banner || true
          .venv/bin/python scripts/security_gate.py gitleaks \
            reports/security/gitleaks.json --severity HIGH \
            --status reports/security/status.json

      - name: Sanitize Secret Scan Report
        if: always()
        run: |
          # The raw report carries matched values (no --redact above) and feeds
          # the gate step only. Only the sanitized copy is uploaded: Secret/Match
          # values are replaced, so a leaked value can never be republished via
          # the artifact on this public repository.
          .venv/bin/python scripts/sanitize_gitleaks_report.py \
            reports/security/gitleaks.json \
            reports/security/gitleaks-sanitized.json

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quality-reports
          path: |
            reports/security/gitleaks-sanitized.json
            reports/security/status.json
