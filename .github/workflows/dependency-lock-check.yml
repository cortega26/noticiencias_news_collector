name: Dependency lock sync

on:
  push:
    branches: [main]
    paths:
      - "requirements.lock"
      - "requirements-security.lock"
      - "pyproject.toml"
      - ".github/workflows/dependency-lock-check.yml"
  pull_request:
    paths:
      - "requirements.lock"
      - "requirements-security.lock"
      - "pyproject.toml"
      - ".github/workflows/dependency-lock-check.yml"

permissions:
  contents: read


jobs:
  lock-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Refresh lockfiles (check mode)
        run: python scripts/sync_lockfiles.py --check --install-pip-tools
