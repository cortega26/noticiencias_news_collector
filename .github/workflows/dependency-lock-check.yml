# Lock freshness gate for all four hash-pinned lockfiles (runtime, refinery,
# security, and the isolated semgrep tool env). If a lock drifts, the heal path
# is the manual-lock-sync workflow (workflow_dispatch), which regenerates and
# commits them with pip-tools.
name: Dependency lock sync

on:
  push:
    branches: [main]
    paths:
      - "requirements.lock"
      - "requirements-security.lock"
      - "requirements-refinery.lock"
      - "requirements-semgrep.lock"
      - "pyproject.toml"
      - ".github/workflows/dependency-lock-check.yml"
  pull_request:
    paths:
      - "requirements.lock"
      - "requirements-security.lock"
      - "requirements-refinery.lock"
      - "requirements-semgrep.lock"
      - "pyproject.toml"
      - ".github/workflows/dependency-lock-check.yml"

permissions:
  contents: read


jobs:
  lock-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Refresh lockfiles (check mode)
        run: python scripts/sync_lockfiles.py --check --install-pip-tools
