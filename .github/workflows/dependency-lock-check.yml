name: Dependency lock sync

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read


jobs:
  lock-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Refresh lockfiles (check mode)
        run: python scripts/sync_lockfiles.py --check --install-pip-tools
