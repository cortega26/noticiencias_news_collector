name: Dependency lock sync

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read


jobs:
  lock-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Refresh lockfiles (check mode)
        run: python scripts/sync_lockfiles.py --check --install-pip-tools
      - name: Upload regenerated lockfiles on drift
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: regenerated-lockfiles
          path: |
            requirements.lock
            requirements-refinery.lock
            requirements-security.lock
