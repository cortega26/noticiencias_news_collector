name: Publication Smoke Test

on:
  pull_request:
    paths:
      - "news_collector/contracts/frontend_schema.py"
      - "news_collector/contracts/publication_validation.py"
      - "news_collector/logic/workflows/frontend_publication_validation.py"
      - "news_collector/logic/workflows/**"
      - "news_collector/components/publishing/**"
      - "scripts/generate_fixture_post.py"
      - "scripts/validate_frontend_publication.py"
  workflow_dispatch:

concurrency:
  group: publication-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  publication-smoke:
    name: Validate generated post against front-end schema
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout back-end
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ./.github/actions/setup-python-env
        with:
          cache-key: ${{ hashFiles('requirements.lock', 'requirements-security.lock') }}

      - name: Checkout front-end (sparse)
        # Fetch only the files required by the real frontend gates used in smoke validation.
        # Note: path must be inside the workspace for actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: cortega26/noticiencias
          path: .tmp/noticiencias
          sparse-checkout: |
            src/
            public/
            data/
            scripts/
            package.json
            package-lock.json
            astro.config.mjs
            tailwind.config.mjs
            tsconfig.json
            .nvmrc
            eslint.config.mjs
            tests/
            vitest.config.ts
            README.md
            AGENTS.md
            CLAUDE.md
            docs/
            .github/workflows/
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .tmp/noticiencias/package-lock.json

      - name: Run backend-driven frontend publication validation
        run: |
          .venv/bin/python scripts/validate_frontend_publication.py \
            --frontend-root .tmp/noticiencias \
            --summary-output data/runtime/publication_smoke/frontend_publication_validation_summary.json

      - name: Upload smoke summary artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-publication-validation-summary
          path: data/runtime/publication_smoke/frontend_publication_validation_summary.json
          if-no-files-found: warn
