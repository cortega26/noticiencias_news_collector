name: Live Source Drift

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read


jobs:
  live-source-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Bootstrap
        run: make bootstrap

      - name: Run live critical cohort sweep
        run: |
          .venv/bin/python scripts/run_live_source_drift.py \
            --bundle-dir artifacts/live-source-drift

      - name: Run frontend handoff smoke on clean checkout
        env:
          NOTICIENCIAS_FRONTEND_ROOT: ${{ github.workspace }}/../noticiencias
        run: |
          git clone --depth=1 https://github.com/${{ github.repository_owner }}/noticiencias.git ../noticiencias
          .venv/bin/python scripts/run_pipeline_e2e.py happy_path_latam_winner \
            --bundle-root artifacts/live-publication-smoke

      - name: Upload live drift artifacts
        uses: actions/upload-artifact@v7
        with:
          name: live-source-drift
          path: |
            artifacts/live-source-drift
            artifacts/live-publication-smoke
