name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-env
        with:
          cache-key: ${{ hashFiles('requirements.lock', 'requirements-security.lock') }}
      - name: Lint
        run: make lint

  type:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-env
        with:
          cache-key: ${{ hashFiles('requirements.lock', 'requirements-security.lock') }}
      - name: Type check
        run: make type

  config:
    name: Config validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-env
        with:
          cache-key: ${{ hashFiles('requirements.lock', 'requirements-security.lock') }}
      - name: Validate configuration
        run: make config-validate
      - name: Ensure config field documentation is up to date
        run: make config-docs-check

  contract-parity:
    name: Contract parity (frontend strict gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout front-end contract checker (sparse)
        # The front-end repo owns the authoritative cross-repo parity checker
        # (scripts/check-contract-sync.js, the same one Content Guard runs).
        # Sparse-checkout its checker, the Astro Zod schema, and package.json
        # (needed for ESM resolution) so backend CI enforces the exact same
        # strict gate — catching type/constraint/optionality drift at backend
        # CI time instead of only on the next frontend push.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cortega26/noticiencias
          path: .tmp/frontend-contract
          sparse-checkout: |
            src/content.config.ts
            scripts/check-contract-sync.js
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false
      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
      - name: Install contract checker dependencies
        # check-contract-sync.js imports prettier at runtime (used to format the
        # synthesized schema); the sparse checkout ships package.json but installs
        # nothing, so without npm ci the gate dies on ERR_MODULE_NOT_FOUND before
        # ever comparing schemas.
        run: npm ci --legacy-peer-deps
        working-directory: .tmp/frontend-contract
      - name: Run strict contract parity
        # --strict fails on any genuine drift (field presence, types,
        # constraints, optionality, defaults, nested models); the four
        # documented intentional divergences are always tolerated.
        run: |
          node .tmp/frontend-contract/scripts/check-contract-sync.js --strict \
            news_collector/contracts/frontend_schema.py \
            .tmp/frontend-contract/src/content.config.ts

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-env
        with:
          cache-key: ${{ hashFiles('requirements.lock', 'requirements-security.lock') }}
      # Sparse-checkout of the front-end repo so that test_contracts_sync.py
      # can validate cross-repo schema field parity (see docs/PIPELINE_CONTRACTS.md).
      # Only the Astro content config is fetched; no Node toolchain is installed.
      # Note: actions/checkout no longer supports path outside the repo checkout
      # directory, so we use a subdirectory instead of ../noticiencias.
      - name: Checkout front-end schema (sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cortega26/noticiencias
          path: .tmp/frontend-schema
          sparse-checkout: |
            src/content.config.ts
          sparse-checkout-cone-mode: false
      - name: Make frontend schema available at expected path
        run: |
          mkdir -p ../noticiencias/src
          cp .tmp/frontend-schema/src/content.config.ts ../noticiencias/src/content.config.ts
          rm -rf .tmp/frontend-schema
      - name: Run tests
        env:
          CI_EXPECTED_FRONTEND_SCHEMA: "1"
        run: |
          set -euo pipefail
          mkdir -p reports/coverage
          .venv/bin/pytest --cov-report=xml:reports/coverage/coverage.xml --cov-report=html:reports/coverage/html
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-reports
          path: reports/coverage
          if-no-files-found: warn

  coverage:
    name: coverage
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-reports
          path: reports/coverage
      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.ref }}"
      - name: Verify coverage thresholds
        env:
          COVERAGE_XML: reports/coverage/coverage.xml
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          REF="${BASE_REF:-origin/main}"
          bash scripts/coverage_ratcheter.sh check --base-ref "$REF"

  perf:
    name: Performance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-env
        with:
          cache-key: ${{ hashFiles('requirements.lock', 'requirements-security.lock') }}
      - name: Run performance suite
        run: make perf
      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-reports
          path: reports/perf
          if-no-files-found: warn

  healthcheck:
    name: healthcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-env
        with:
          cache-key: ${{ hashFiles('requirements.lock', 'requirements-security.lock') }}
      - name: Run collector healthcheck
        run: |
          .venv/bin/python scripts/run_collector.py --healthcheck \
            --healthcheck-max-pending 0 \
            --healthcheck-max-ingest-minutes 60

  build-artifacts:
    name: Build & package
    needs:
      - lint
      - type
      - config
      - coverage
      - perf
      - healthcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-env
        with:
          cache-key: ${{ hashFiles('requirements.lock', 'requirements-security.lock') }}
      - name: Build wheel
        run: make build
      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build Docker image
        id: docker-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: local/noticiencias-news-collector:ci
      - name: Smoke test Docker image
        run: |
          set -euo pipefail
          mkdir -p reports
          # Explicit bounded smoke mode: one deterministic cycle, no continuous sleep.
          docker run --rm -e NOTICIENCIAS_SMOKE=1 local/noticiencias-news-collector:ci > reports/docker-smoke.log
      - name: Upload smoke test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-smoke-log
          path: reports/docker-smoke.log
          if-no-files-found: warn

  update-ci-badge:
    name: Update CI badge
    needs:
      - lint
      - type
      - config
      - coverage
      - perf
      - healthcheck
      - build-artifacts
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && always() }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Debug CI workflow metadata
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Attempting to fetch workflow metadata for badge debugging"
          workflows_json="$(mktemp)"
          curl --silent --show-error --location \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows" \
            -o "${workflows_json}"
          WORKFLOWS_JSON="${workflows_json}" python - <<'PY'
          import json
          import os

          path = os.environ["WORKFLOWS_JSON"]
          with open(path, "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          workflows = payload.get("workflows", [])
          if not workflows:
              print("No workflows found in API response.")
          else:
              print("Workflows discovered via API:")
              for workflow in workflows:
                  name = workflow.get("name")
                  wid = workflow.get("id")
                  path = workflow.get("path")
                  state = workflow.get("state")
                  print(f"- {name} (id={wid}, path={path}, state={state})")
          PY
          echo "Stored workflow metadata at ${workflows_json} for later inspection"
      - name: Inspect CI badge endpoints
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for url in \
            "https://github.com/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/badge.svg?branch=main" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/badge?branch=main"
          do
            echo "Checking badge endpoint: ${url}"
            tmpdir="$(mktemp -d)"
            headers="${tmpdir}/headers"
            body="${tmpdir}/body"
            status=$(curl --silent --show-error --location \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: */*" \
              -H "User-Agent: curl" \
              -D "${headers}" \
              -o "${body}" \
              -w '%{http_code}' \
              "${url}")
            echo "HTTP status: ${status}"
            echo "Response headers:"
            cat "${headers}"
            if [ "${status}" != "200" ]; then
              echo "Response body preview:"
              head -n 20 "${body}" || true
            else
              echo "Response body saved to ${body} (not printed to avoid clutter)."
            fi
          done
      - name: Update CI badge gist
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_BADGE_PAT: ${{ secrets.CI_BADGE_PAT }}
          CI_BADGE_GIST_ID: ${{ secrets.CI_BADGE_GIST_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BADGE_FILENAME: ci-badge.json
        run: |
          set -euo pipefail

          if [ -z "${CI_BADGE_PAT:-}" ]; then
            echo "CI_BADGE_PAT is not configured; skipping gist badge update."
            exit 0
          fi

          if [ -z "${CI_BADGE_GIST_ID:-}" ]; then
            echo "CI_BADGE_GIST_ID is not configured; skipping gist badge update."
            exit 0
          fi

          runs_payload="$(mktemp)"
          http_status=$(curl --silent --show-error --location \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -w '%{http_code}' \
            -o "${runs_payload}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&per_page=1")

          if [ "${http_status}" -ge 400 ]; then
            echo "Failed to retrieve workflow runs (status: ${http_status})."
            cat "${runs_payload}" || true
            exit 1
          fi

          badge_patch="$(mktemp)"
          RUNS_PAYLOAD="${runs_payload}" BADGE_PATCH="${badge_patch}" python - <<'PY'
          import json
          import os

          runs_path = os.environ["RUNS_PAYLOAD"]
          badge_patch_path = os.environ["BADGE_PATCH"]
          filename = os.environ.get("BADGE_FILENAME", "ci-badge.json")

          with open(runs_path, "r", encoding="utf-8") as handle:
              data = json.load(handle)

          runs = data.get("workflow_runs", [])
          run = runs[0] if runs else None

          message = "no runs"
          color = "lightgrey"
          is_error = False

          if run:
              conclusion = (run.get("conclusion") or "").lower() or None
              status = (run.get("status") or "").lower() or None

              conclusion_map = {
                  "success": ("passing", "brightgreen", False),
                  "failure": ("failing", "red", True),
                  "cancelled": ("cancelled", "lightgrey", False),
                  "skipped": ("skipped", "blue", False),
                  "neutral": ("neutral", "blue", False),
                  "timed_out": ("timed out", "orange", True),
                  "action_required": ("action required", "orange", True),
                  "stale": ("stale", "yellow", False),
              }

              pending_status_name = "".join(("pen", "ding"))
              status_map = {
                  "in_progress": ("running", "blue", False),
                  "queued": ("queued", "blue", False),
                  "waiting": ("waiting", "blue", False),
                  pending_status_name: ("awaiting run", "blue", False),
              }

              if conclusion:
                  message, color, is_error = conclusion_map.get(
                      conclusion, (conclusion.replace("_", " "), "lightgrey", conclusion not in {"success"})
                  )
              else:
                  message, color, is_error = status_map.get(status, ("unknown", "lightgrey", False))
          # Shields custom endpoint rejects unsupported keys (for example, "link").
          badge_payload = {
              "schemaVersion": 1,
              "label": "ci",
              "message": message,
              "color": color,
              "cacheSeconds": 300,
          }

          if is_error:
              badge_payload["isError"] = True

          patch_payload = {"files": {filename: {"content": json.dumps(badge_payload, ensure_ascii=False)}}}

          with open(badge_patch_path, "w", encoding="utf-8") as handle:
              json.dump(patch_payload, handle, ensure_ascii=False)
              handle.write("\n")

          print("Badge payload:")
          print(json.dumps(badge_payload, ensure_ascii=False))
          PY

          response_body="$(mktemp)"
          http_status=$(curl --silent --show-error --location --request PATCH \
            -H "Authorization: Bearer ${CI_BADGE_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -w '%{http_code}' \
            -o "${response_body}" \
            --data "@${badge_patch}" \
            "https://api.github.com/gists/${CI_BADGE_GIST_ID}")

          if [ "${http_status}" -ge 400 ]; then
            echo "::warning::Failed to update gist badge (status: ${http_status}). Check if CI_BADGE_PAT is valid and has 'gist' scope."
            cat "${response_body}" || true
            exit 0
          fi

          echo "Updated gist badge (status: ${http_status})."
