name: 'Setup Python Environment'
description: 'Configures Python, restores virtualenv cache, and bootstraps project dependencies'
inputs:
  python-version:
    description: 'Python version to set up'
    required: false
    default: '3.13'
  cache-key:
    description: >
      Hash-based cache key fragment from requirements.lock.
      When empty, virtualenv caching is skipped.
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Restore virtualenv cache
      if: ${{ inputs.cache-key != '' }}
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ inputs.python-version }}-${{ inputs.cache-key }}

    - name: Bootstrap (idempotent)
      shell: bash
      run: make bootstrap
