include:
  - "**/*.py"
  - "**/*.md"
exclude:
  - "venv/**"
  - ".venv/**"
  - "node_modules/**"
  - "dist/**"
  - "build/**"
  - "**/*.min.*"
  - "**/generated/**"
  # Self-audit exclusions: the paths below contain audit-pattern examples as
  # test data, not real placeholders. tests/placeholder_audit/fixtures/** holds
  # intentionally malformed markers asserted by unit tests, and
  # test_placeholder_audit.py embeds TODO/FIXME strings inside literals that the
  # same tests assert on. Scanning them can only produce false positives.
  - "tests/placeholder_audit/fixtures/**"
  - "tests/placeholder_audit/test_placeholder_audit.py"
contexts:
  prod_code: ["**/*.py"]
  tests: ["tests/**", "examples/**"]
  docs: ["**/*.md"]
required_fields: ["owner", "due", "issue"]
due_format: "YYYY-MM-DD"
warn_window_days: 7
age_threshold_days:
  warn: 30
  high: 90
block_severities: ["HIGH"]
delta_mode: true
pr_halo_lines: 10
