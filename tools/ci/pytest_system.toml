[project]
name = "noticiencias-news-collector"
dynamic = ["version"]
description = "Scientific news aggregation pipeline for the Noticiencias project"
requires-python = ">=3.13"
dependencies = [
    "feedparser>=6.0.12",
    "requests>=2.32.5",
    "beautifulsoup4>=4.14.2",
    "lxml>=6.0.2",
    "sqlalchemy>=2.0.43",
    "pydantic>=2.11.9",
    "loguru>=0.7.3",
    "httpx>=0.28.1",
    "scikit-learn>=1.7.2",
    "numpy>=2.3.3,!=2.4.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "news_collector"]
# Override addopts to focus on system directory but filter via config
addopts = "-ra --cov=news_collector/system --cov-report=term-missing --cov-fail-under=80"
markers = [
    "e2e: end-to-end scenarios",
]
asyncio_mode = "auto"


