# Fly.io app: Noticiencias webhook serving layer.
# Deploy: fly deploy --config fly-serving.toml
app = "noticiencias-serve"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile.serving"

[env]
  # WEBHOOK_API_KEY set via: fly secrets set WEBHOOK_API_KEY=<value>

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
