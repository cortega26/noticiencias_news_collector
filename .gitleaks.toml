title = "Noticiencias Secret Scan"

[allowlist]
description = "Ignore known non-sensitive fixtures and generated assets."
paths = [
  '''^tests/data/''',
  '''^tests/test_security_gate.py$''',
  '''^tests/test_llm_rate_limiter\.py$''',
  '''^docs/fixtures/''',
  '''^docs/examples/''',
  '''^reports/''',
  '''^\.venv/''',
  '''^\.temp_venv/''',
  '''^apps/refinery/\.env\.example$''',
  '''^apps/refinery/admin_panel\.py$''',
  '''^tests/unit/scoring/test_cognitive_scorer\.py$''',
  '''^\.env\.example$''',
  '''^news_collector/config/sources\.yaml$''',
  '''^README\.md$''',
  # Tracked generated export (schema-validated article text, not hand-edited);
  # allowlisted so prose like "key responsibilities" does not mask real findings
  # in hand-written files. Revisit if the export becomes hand-editable.
  '''^data/exports/latest_articles\.json$''',
  # Identifiers in code/docs matched by generic-api-key (Secret is just
  # "key"/"KEY"); provably not credentials — re-check if content changes.
  '''^noticiencias/config_manager\.py$''',
  '''^audit/03_config_matrix\.md$''',
  # Placeholder/fixture values in test and documentation files.
  '''^tests/integration/test_publication_callback_contract\.py$''',
  # Canary payload fixtures: matches are fake key names / placeholder values
  # used to exercise the redaction parser, not credentials.
  '''^tests/scripts/test_editorial_critic_canary\.py$''',
  # Bounds-test placeholders (e.g. a fake "token" value asserting
  # non-persistence); no real credentials in this file.
  '''^tests/unit/serving/test_write_surface_bounds\.py$''',
  # GUI source: 'refinery_admin_token' is a sessionStorage KEY NAME, not a
  # credential value (matched by generic-api-key's 16+ char rule).
  '''^apps/admin/src/lib/api\.ts$''',
  # Plan 171 moved the same token helpers to auth.ts; identical rationale.
  '''^apps/admin/src/lib/auth\.ts$''',
  # Plan 185 reader-report tests: `idempotency_key` is the report-dedupe
  # FIELD NAME (trips generic-api-key's "key" match); values are fake
  # delivery ids, never credentials.
  '''^tests/unit/storage/test_reader_reports_models\.py$''',
  # Plan 186 reconciliation tests: fake bearer-token / fake report-uuid
  # fixtures (no real Cloudflare credentials anywhere in tests).
  '''^tests/unit/infrastructure/test_r2_client\.py$''',
  '''^tests/unit/storage/test_reader_report_repository\.py$''',
  '''^tests_refinery/test_admin_panel_weights\.py$''',
  '''^docs/RUNBOOK_LOCAL_DEV\.md$''',
  '''^fly-tunnel\.toml$''',
  '''^plans/001-externalize-committed-secrets\.md$''',
  '''^plans/033-make-config-refresh-live\.md$''',
  # Eighth-pass plan 123 quotes the admin TOKEN_KEY constant name from
  # apps/admin/src/lib/api.ts (same KEY-NAME-NOT-CREDENTIAL rationale as above);
  # listed at both its committed path and its plans/archive/ location.
  '''^plans/123-serving-edge-hardening\.md$''',
  '''^plans/archive/123-serving-edge-hardening\.md$''',
]
regexes = [
  '''dummy(_|-)secret''',
  '''test(_|-)api(_|-)key''',
  # Code/doc identifiers matched by generic-api-key, provably not credentials:
  '''_serialize_for_toml''',
  '''ENRICHMENT_PROVIDER''',
]
commits = [
  "9c9bdf23e48ba2d0154d59404eac61b29ce24a40",
  "bce631a5ec1c61accc83700ae5ed47e84f1ec832",
]

[[rules]]
id = "generic-api-key"
description = "Generic API or secret token"
regex = '''(?i)(api|token|secret|key)["'=:\s]+[A-Za-z0-9_\-]{16,}'''
secretGroup = 0
tags = ["secret", "generic"]

# `delivery_key = compute_delivery_key(...)` (plan 060 Phases 5a/5b) matches
# the generic rule as `key = compute_delivery_key`, but is a code identifier,
# not a credential. Scoped to this rule and to the matched text — it must not
# mask findings in other files or rules. Re-check if the helper is renamed.
[rules.allowlist]
description = "Publication delivery-key helper name, not a credential."
regexTarget = "match"
regexes = [
  '''compute_delivery_key''',
  # Historical replay code used this exact assignment for a row identity.
  # Anchored to the Gitleaks match so longer values still trigger the rule.
  '''^key = _completed_cross_critic_key$''',
]
