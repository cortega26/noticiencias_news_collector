repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^(reports/|audit/|tests/|docs/)
      - id: trailing-whitespace
        exclude: ^(reports/|audit/|tests/|docs/)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: [--config=pyproject.toml]
  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
        args: [--config=pyproject.toml]
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--settings-path=pyproject.toml]
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        files: ^news_collector/
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        args: [--config-file=pyproject.toml]
        files: ^(scripts/generate_api_docs\.py|news_collector/utils/(logger|url_canonicalizer)\.py)$
      - id: generate-api-docs
        name: Generate API docs with pdoc
        entry: python scripts/generate_api_docs.py
        language: python
        additional_dependencies:
          - pdoc==15.0.4
          - python-dotenv
        pass_filenames: false
        stages: [pre-commit, manual]
      # Free-tier equivalent of GitHub server-side push protection (private
      # repos require GHAS for that). Runs on `pre-commit install
      # --hook-type pre-push`; blocks any push whose history/tree contains a
      # secret, using the same config + baseline as CI (make security).
      - id: gitleaks-push
        name: gitleaks secret scan (pre-push)
        entry: gitleaks detect --source . --config .gitleaks.toml --baseline-path .gitleaks-baseline.json --no-banner
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
