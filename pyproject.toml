[project]
name = "noticiencias-news-collector"
dynamic = ["version"]
description = "Scientific news aggregation pipeline for the Noticiencias project"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Noticiencias Team" }]

dependencies = [
    "feedparser>=6.0.12",
    "requests>=2.32.5",
    "beautifulsoup4>=4.14.2",
    "lxml>=6.0.2",
    "nltk>=3.9.2",
    "textblob>=0.19.0",
    "python-dateutil>=2.9.0",
    "sqlalchemy>=2.0.43",
    "python-dotenv>=1.1.1",
    "schedule>=1.2.2",
    "click>=8.3.0",
    "ruamel.yaml>=0.18.6",
    "tomli-w>=1.0.0",
    "fastapi>=0.128.0",
    "pydantic>=2.11.9",
    "loguru>=0.7.3",
    "httpx>=0.28.1",
    "scikit-learn>=1.7.2",
    "numpy>=2.3.3,!=2.4.0",
    "streamlit>=1.30.0",
    "gitpython>=3.1.41",
    "watchdog>=4.0.0",
    "toml>=0.10.2",
    "alembic>=1.13.1",
    "starlette>=0.49.1",
    "urllib3>=2.6.3",
    "types-requests>=2.31.0",
]

[project.optional-dependencies]
security = [
    "bandit>=1.7.9",
    "pip-audit>=2.9.0",
    "semgrep>=1.60.0",
]
test = [
    "coverage[toml]==7.10.7",
    "hypothesis==6.104.1",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "pytest-asyncio==0.23.5",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {file = "news_collector/config/VERSION"}

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["news_collector"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "W",  # pycodestyle warnings
    "B",  # flake8-bugbear
    "I",  # isort
    "C4", # flake8-comprehensions
    "SIM",# flake8-simplify
    "S",  # flake8-bandit (security)
    "C90",# mccabe (complexity)
]
ignore = [
    "E203",  # whitespace before ':' (black compatibility)
    "E402",  # allow runtime path adjustments before imports
    "E501",  # long URLs and SQL statements managed manually
    "B027",  # allow optional no-op hooks in abstract classes
    "S101",  # use of assert detected (allowed in tests usually, will handle via per-file-ignores)
    "SIM108",# allow if-else blocks instead of ternary operators for readability
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["news_collector", "tests", "scripts", "apps", "tools"]

[tool.mypy]
python_version = "3.13"
packages = ["news_collector", "tests"]
ignore_missing_imports = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
strict_optional = true
no_implicit_optional = true
follow_imports = "normal"
plugins = []

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "news_collector.config.*",
    "noticiencias.*",
    "news_collector.collectors.*",
    "news_collector.enrichment.*",
    "news_collector.monitoring.*",
    "news_collector.perf.*",
    "news_collector.reranker.*",
    "news_collector.scoring.*",
    "news_collector.serving.*",
    "news_collector.storage.*",
    "tools.*",
]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "news_collector"]
addopts = "-ra --cov=news_collector/contracts --cov=news_collector/reranker --cov=news_collector/utils --cov-branch --cov-report=term-missing"
markers = [
    "e2e: end-to-end scenarios that exercise the pipeline",
    "perf: performance-focused regression tests",
    "security: security and compliance checks",
    "regression: regression tests (no network)",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["news_collector/contracts", "news_collector/reranker", "news_collector/utils"]
omit = [
    "news_collector/utils/logger.py",
    "news_collector/utils/metrics.py",
    "news_collector/utils/datetime_utils.py",
]

[tool.coverage.report]
precision = 2
skip_covered = false
show_missing = true

[tool.mutmut]
paths_to_mutate = [
    "news_collector/utils/text_cleaner.py",
    "news_collector/utils/url_canonicalizer.py",
]
tests_dir = [
    "tests/mutation_smoke",
    "tests/property",
    "tests/test_text_cleaner.py",
    "tests/test_url_canonicalizer.py",
]
also_copy = [
    "news_collector/config",
    "noticiencias",
    "news_collector",
    "tests",
    "run_collector.py",
    "news_collector/config/VERSION",
]
python_paths = ["news_collector"]
runner = "python -m pytest"
backup = false

[tool.ruff.lint.per-file-ignores]
"news_collector/serving/api.py" = ["B008"]
"tests/*" = ["S101", "S105", "S311", "SIM117", "S103", "S106", "S108", "S113", "S603"] # allow asserts, hardcoded secrets, random, nested with, and other test-specific practices
"scripts/*" = ["S"] # allow lax security in ops scripts
"tools/*" = ["S603", "S607", "SIM"] # allow subprocess in tools, suppress simplistic checks

[tool.bandit]
exclude_dirs = [
    "tests",
    "tests/data",
    "docs",
    "build",
    "reports",
    ".venv",
    ".git"
]
skips = [
    "B101", # assert used in tests
    "B110", # insecure temp usage in controlled contexts
    "B112", # try-except-continue
    "B113", # requests without timeout
    "B311", # random used for simulation/jitter
    "B324", # hashlib.md5 used for non-cryptographic hashing in dedupe utilities
    "B410", # lxml usage
    "B411",
    "B603"
]
targets = ["news_collector", "scripts"]
