[project]
name = "noticiencias-news-collector"
dynamic = ["version"]
description = "Scientific news aggregation pipeline for the Noticiencias project"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Noticiencias Team" }]

dependencies = [
    "feedparser>=6.0.12",
    "requests>=2.32.5",
    "beautifulsoup4>=4.14.2",
    "lxml>=6.1.0",
    "python-dateutil>=2.9.0",
    "sqlalchemy>=2.0.43",
    "psycopg[binary]>=3.2.0",  # PostgreSQL driver — plan 046 (docker-compose already declares DATABASE_URL)
    "python-dotenv>=1.1.1",
    "PyYAML>=6.0.1",
    "tomli-w>=1.0.0",
    "fastapi>=0.128.0",
    "python-multipart>=0.0.20",  # Form/File uploads (admin image brief staging)
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.11.9",
    "loguru>=0.7.3",
    "httpx>=0.28.1",
    "scikit-learn>=1.7.2",
    "click>=8.3.3",
    "playwright>=1.58.0",
    "scrapling[fetchers]>=0.4.0",
    "numpy>=2.3.3,!=2.4.0",
    "alembic>=1.13.1",
    "starlette>=0.49.1",
    "tenacity>=8.1.0",
    "gitpython>=3.2.1",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
refinery = [
    "streamlit>=1.66.1",
    "watchdog>=4.0.0",
    "pandas>=2.0.0",
]
security = [
    "bandit>=1.7.9",
    "pip-audit>=2.9.0",
]
# Semgrep is a pinned tool (like gitleaks), not an audited dependency: it pins
# mcp==1.29.0 exactly, which carries GHSA-84m7-p3x7-pcfv. It lives in its own
# hash-pinned lock installed only into .venv-security (plan 156).
sast = [
    "semgrep>=1.60.0",
]
test = [
    "coverage[toml]>=7.0.0",
    "hypothesis>=6.100.0",
    "pytest>=7.4.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.6.0",       # ejecución paralela: pytest -n auto (plan 196)
    "respx>=0.22.0",             # mocks deterministas de httpx (plan 196)
    "time-machine>=2.16.0",      # congelar el reloj en tests (plan 196)
    "import-linter>=2.1",        # contratos de capas: make lint-imports (plan 196)
    "deptry>=0.23.0",            # dependencias no usadas/no declaradas (plan 196)
    # mypy-only stubs: kept out of [project].dependencies so Dockerfile.serving
    # no longer ships them in the runtime image (plan 145).
    "types-requests>=2.31.0",
    "types-PyYAML==6.0.12.20250915",
    "types-python-dateutil==2.9.0.20260124",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {file = "news_collector/config/VERSION"}

[tool.setuptools.packages.find]
include = ["news_collector*", "noticiencias*", "scripts*"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["news_collector"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "W",  # pycodestyle warnings
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM",# flake8-simplify
    "S",  # flake8-bandit (security)
    "C90",# mccabe (complexity)
]
# Note: isort is deliberately NOT selected — it is the repo's import-order
# owner (first in the pre-commit hook, own config in pyproject). Enabling
# ruff's I rules created a fix-loop: ruff I001 reordered intra-function
# imports that isort accepts, so the two tools cycled forever (2026-08-12).
ignore = [
    "E203",  # whitespace before ':' (black compatibility)
    "E402",  # allow runtime path adjustments before imports
    "E501",  # long URLs and SQL statements managed manually
    "B027",  # allow optional no-op hooks in abstract classes
    "S101",  # use of assert detected (allowed in tests usually, will handle via per-file-ignores)
    "SIM108",# allow if-else blocks instead of ternary operators for readability
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["news_collector", "tests", "scripts", "apps", "tools"]
skip_gitignore = true

[tool.mypy]
python_version = "3.13"
packages = ["news_collector", "tests"]
exclude = ["temp/", "tools/", "scripts/"]
ignore_missing_imports = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
strict_optional = true
no_implicit_optional = true
follow_imports = "normal"
plugins = []
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = [".", "news_collector"]
addopts = "-ra --timeout=10 --cov=news_collector --cov=apps --cov=noticiencias --cov-branch --cov-report=term-missing -p randomly"
markers = [
    "e2e: end-to-end scenarios that exercise the pipeline",
    "perf: performance-focused regression tests",
    "security: security and compliance checks",
    "regression: regression tests (no network)",
    "audit: real-network source reliability sweep (opt-in, gated by NOTICIENCIAS_AUDIT)",
]
asyncio_mode = "auto"
filterwarnings = [
    # SQLAlchemy's compiled-statement LRU cache holds Column refs past engine.dispose();
    # these ResourceWarnings fire during interpreter shutdown GC and are not actionable.
    "ignore::ResourceWarning:sqlalchemy",
    # unittest.mock teardown GC of patched DB objects triggers the same pattern.
    "ignore::ResourceWarning:unittest.mock",
    # Third-party: fastapi's testclient flags its own httpx dependency ("install
    # httpx2") on every TestClient import — no action available in this repo
    # until fastapi/starlette ship the new client (tracked, not silence-and-forget).
    # Message-regex form: the warning class isn't resolvable by name and the
    # warning can fire from importlib frames with no module attribute.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # starlette 1.6 TestClient still uses the anyio.abc.BlockingPortal alias that anyio 4.15
    # deprecated; third-party, no action until starlette updates (found in dependency group 1).
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]

[tool.coverage.run]
branch = true
source = ["news_collector", "noticiencias"]
omit = [
    "news_collector/utils/logger.py",
    "news_collector/utils/metrics.py",
    "news_collector/utils/datetime_utils.py",
    # Streamlit UI entrypoint: cannot be imported under the test venv
    # (Streamlit isn't installed there). Its helpers are exercised via AST
    # decomposition in tests/decompose_refinery/ and
    # tests/unit/refinery/test_save_toml_config.py. Excluded so the gate
    # doesn't demand an unreachable 90% line coverage (see
    # scripts/coverage_ratcheter.sh omit handling).
    "apps/refinery/admin_panel.py",
    # E2E publication harness: heavy git/subprocess/fixture I/O (git init,
    # copytree, npx prettier, sockets/FIFOs) plus defensive branches
    # (missing npx, missing frontend root, dirty-repo commit guards) that
    # the 90% changed-file gate would demand unreachably. It is exercised
    # directly by tests/e2e_pipeline/ and tests/unit/logic/workflows/
    # test_pipeline_e2e_seams.py; excluded from measurement for the same
    # reason as admin_panel.py.
    "news_collector/logic/workflows/pipeline_e2e.py",
]

[tool.coverage.report]
precision = 2
skip_covered = false
show_missing = true

[tool.mutmut]
# Mutation testing (mutmut 3): source_paths are copied to ./mutants and mutated one
# operator at a time; a surviving mutant is a behavior change no test notices.
# Pilot scope = pure, critical policy modules; widen as scores are established.
source_paths = [
    "news_collector/collectors/admission.py",
    "news_collector/editorial/categories.py",
    "news_collector/editorial/grounding.py",
    "news_collector/editorial/health_scope.py",
    "news_collector/infrastructure/llm/failure_kinds.py",
    "news_collector/logic/workflows/publication_identity.py",
    "news_collector/observability/llm_run_report.py",
    "news_collector/utils/url_canonicalizer.py",
    "news_collector/validation/rules.py",
]
pytest_add_cli_args_test_selection = [
    "tests/decompose_refinery/test_publication_identity.py",
    "tests/integration/test_database.py",
    "tests/property/test_normalization_properties.py",
    "tests/test_url_canonicalizer.py",
    "tests/unit/collectors/test_admission.py",
    "tests/unit/collectors/test_admission_boundary.py",
    "tests/unit/collectors/test_admission_defaults_and_details.py",
    "tests/unit/collectors/test_rss_collector.py",
    "tests/unit/collectors/test_rss_collector_coverage_101.py",
    "tests/unit/editorial/test_category_resolver.py",
    "tests/unit/editorial/test_classifier.py",
    "tests/unit/editorial/test_editorial_publication_artifact.py",
    "tests/unit/editorial/test_grounding.py",
    "tests/unit/editorial/test_grounding_shapes.py",
    "tests/unit/editorial/test_health_claims.py",
    "tests/unit/editorial/test_health_scope.py",
    "tests/unit/infrastructure/llm/test_provider_chain.py",
    "tests/unit/infrastructure/llm/test_failure_kinds_boundaries.py",
    "tests/unit/logic/workflows/test_manual_ingest_policy.py",
    "tests/unit/logic/workflows/test_publication_identity_contract.py",
    "tests/unit/observability/test_llm_metrics_store.py",
    "tests/unit/observability/test_llm_run_report.py",
    "tests/unit/observability/test_llm_run_report_shapes.py",
    "tests/unit/test_canonical_url_identity.py",
    "tests/unit/utils/test_url_canonicalizer_table.py",
    "tests/validation/test_validator.py",
]
pytest_add_cli_args = [
    "-o", "addopts=", "-p", "no:randomly", "-x", "-q",
]
also_copy = ["news_collector", "noticiencias", "apps", "tests", "scripts", "config.toml"]

# Per-module mutation-score floors (%), enforced by scripts/mutation_score.py --check.
# A floor is the score achieved minus ~3 points of run-to-run noise (mutmut timeouts flap);
# raise it when survivors are killed. admission is deterministic and pinned at 100.
[tool.mutation.floors]
"news_collector/collectors/admission.py" = 100
"news_collector/editorial/categories.py" = 66
"news_collector/editorial/grounding.py" = 85
"news_collector/editorial/health_scope.py" = 82
"news_collector/infrastructure/llm/failure_kinds.py" = 88
"news_collector/logic/workflows/publication_identity.py" = 77
"news_collector/observability/llm_run_report.py" = 85
"news_collector/utils/url_canonicalizer.py" = 82
"news_collector/validation/rules.py" = 93

[tool.ruff.lint.per-file-ignores]
"news_collector/serving/api.py" = ["B008"]
"news_collector/serving/admin_images.py" = ["B008"]
"news_collector/serving/admin_reader_reports.py" = ["B008"]
"tests/*" = ["E", "F", "W", "S", "C", "SIM", "B", "I", "UP", "N"]
"scripts/*" = ["E", "F", "W", "S", "C", "SIM", "B", "I"]
"tools/*" = ["E", "F", "W", "S", "C", "SIM", "B", "I"]
"generate_index.py" = ["C"]
"generate_contexts.py" = ["C"]
"analyze_ab_test.py" = ["C"]

[tool.bandit]
exclude_dirs = [
    "tests",
    "tests/data",
    "docs",
    "build",
    "reports",
    ".venv",
    ".git",
    "temp",
]
skips = [
    "B101", # assert used in tests
    "B110", # insecure temp usage in controlled contexts
    "B112", # try-except-continue
    "B113", # requests without timeout
    "B311", # random used for simulation/jitter
    "B324", # hashlib.md5 used for non-cryptographic hashing in dedupe utilities
    "B410", # lxml usage
    "B411",
    "B603"
]
targets = ["news_collector", "scripts"]

# Contratos de capas (plan 196). Los módulos de política no hacen I/O de red:
# ver docs/AGENTS.md. Ejecuta: make lint-imports
# news_collector/validation queda fuera: es un paquete namespace (sin __init__.py)
# y grimp no lo resuelve.
[tool.importlinter]
root_packages = ["news_collector"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Los módulos de política no importan clientes de red ni collectors"
type = "forbidden"
source_modules = [
    "news_collector.scoring",
    "news_collector.taxonomy",
    "news_collector.editorial",
]
forbidden_modules = [
    "requests",
    "httpx",
    "urllib3",
    "aiohttp",
    "feedparser",
    "playwright",
    "scrapling",
    "news_collector.collectors",
    "news_collector.serving",
]
# Solo imports directos: news_collector/__init__.py importa collectors y serving
# de forma anticipada, así que todo submódulo los alcanza transitivamente.
# Quitar esa carga anticipada permitiría endurecer este contrato (plan 196).
allow_indirect_imports = true

# Auditoría de dependencias (plan 196). Consultivo: make deps-check
[tool.deptry]
extend_exclude = ["archive", "temp.*", "scratch", "mutants", "build", "dist", "perf"]

[tool.deptry.per_rule_ignores]
# Herramientas de desarrollo/CI (se invocan por CLI o plugin, no por import) y
# dependencias de runtime cargadas indirectamente (driver por DATABASE_URL,
# formularios de FastAPI, servidor ASGI).
DEP002 = [
    "bandit", "pip-audit", "semgrep", "coverage", "hypothesis", "pytest",
    "pytest-cov", "pytest-asyncio", "pytest-timeout", "pytest-xdist", "respx",
    "time-machine", "import-linter", "deptry", "types-requests", "types-PyYAML",
    "types-python-dateutil", "psycopg", "python-multipart", "uvicorn", "watchdog",
]
